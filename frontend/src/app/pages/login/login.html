<div class="auth">
  <form class="auth-card" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <h1>Sign in</h1>
    <p class="sub">Welcome back to TaskNest.</p>

    @if (error()) {
      <div class="alert" role="alert">{{ error() }}</div>
    }

    <label for="email">Email</label>
    <input id="email" type="email" formControlName="email" autocomplete="username" placeholder="you@example.com" />
    @if (form.controls.email.touched && form.controls.email.invalid) {
      <small class="field-error">Enter a valid email.</small>
    }

    <label for="password">Password</label>
    <input id="password" type="password" formControlName="password" autocomplete="current-password" />
    @if (form.controls.password.touched && form.controls.password.invalid) {
      <small class="field-error">Password is required.</small>
    }

    <button type="submit" class="btn btn-primary" [disabled]="loading()">
      {{ loading() ? 'Signing in…' : 'Sign in' }}
    </button>

    <p class="switch">New here? <a routerLink="/register">Create an account</a></p>
  </form>
</div>
